apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-exporter
  labels:
    app: mongodb-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-exporter
  template:
    metadata:
      labels:
        app: mongodb-exporter
    spec:
      containers:
        - name: mongodb-exporter
          image: percona/mongodb_exporter:0.40
          ports:
            - name: http
              containerPort: 9216
              protocol: TCP
          args:
            - "--collector.diagnosticdata"
            - "--collector.profile-time-ts=15"
          env:
            - name: MONGODB_URI
              value: "mongodb://mongodb-exporter:example@mongo-0.mongo:27017/admin"
            #   valueFrom:
            #     secretKeyRef:
            #       name: mongo-secret
            #       key: mongo-uri
            # - name: MONGODB_USER
            #   valueFrom:
            #     secretKeyRef:
            #       name: mongo-secret
            #       key: mongo-root-username
            # - name: MONGODB_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: mongo-secret
            #       key: mongo-root-password
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-exporter
  labels:
    app: mongodb-exporter
spec:
  selector:
    app: mongodb-exporter
  ports:
    - protocol: TCP
      port: 9216
      targetPort: 9216
  type: LoadBalancer
