apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  labels:
    app: mongo-express
spec:
  replicas: {{ .Values.database.mongoExpress.replicas }}
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
        - name: mongo-express
          image: {{ .Values.database.mongoExpress.image }}
          env:
            - name: ME_CONFIG_MONGODB_SERVER
              value: "{{ .Values.database.mongoExpress.mongodbServer }}" # Pointing to the first pod in the StatefulSet
            - name: ME_CONFIG_MONGODB_ADMINUSERNAME
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: mongo-root-username
            - name: ME_CONFIG_MONGODB_ADMINPASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: mongo-root-password
            - name: ME_CONFIG_BASICAUTH
              value: "{{ .Values.database.mongoExpress.basicAuth }}"
          ports:
            - containerPort: {{ .Values.database.mongoExpress.port }}
          resources: {}