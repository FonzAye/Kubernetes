apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: mongodb-exporter
        static_configs:
          - targets: ['mongodb-exporter:9216']
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
      - job_name: cadvisor
        static_configs:
          - targets: ['cadvisor:8080']