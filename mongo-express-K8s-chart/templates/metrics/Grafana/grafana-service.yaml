apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - protocol: TCP
      port: {{ .Values.metrics.Grafana.grafana.port }}
      targetPort: {{ .Values.metrics.Grafana.grafana.port }}
  type: LoadBalancer # Use LoadBalancer for external access